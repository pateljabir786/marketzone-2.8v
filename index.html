<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MarketZone 2.8v</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-white">
<header class="flex justify-between p-5 border-b border-zinc-800">
<h1 class="text-2xl font-bold">Market<span class="text-yellow-400">Zone</span> 2.8v 🚀</h1>
<button id="cartBtn" class="bg-white text-black px-5 py-2 rounded-full font-bold">Cart (0) 🛒</button>
</header>

<div class="text-center py-12">
<h2 class="text-4xl font-black">BIGGEST SALE IS LIVE!</h2>
<p class="text-zinc-400 mt-2">Upto 70% Off</p>
</div>

<div class="grid grid-cols-2 gap-4 p-4 max-w-5xl mx-auto">
<div class="bg-zinc-900 rounded-3xl p-5 border border-zinc-800 text-center">
<div class="text-6xl">🎧</div>
<h3 class="font-bold mt-3">Wireless Headphone</h3>
<p class="text-yellow-400 font-bold">₹1499 <span class="line-through text-zinc-500 text-sm">₹2999</span></p>
<button onclick="addCart()" class="w-full bg-yellow-400 text-black font-bold py-3 rounded-full mt-3">Add to Cart</button>
</div>

<div class="bg-zinc-900 rounded-3xl p-5 border border-zinc-800 text-center">
<div class="text-6xl">⌚</div>
<h3 class="font-bold mt-3">Smart Watch 2.8v</h3>
<p class="text-yellow-400 font-bold">₹2499 <span class="line-through text-zinc-500 text-sm">₹4999</span></p>
<button onclick="addCart()" class="w-full bg-yellow-400 text-black font-bold py-3 rounded-full mt-3">Add to Cart</button>
</div>

<div class="bg-zinc-900 rounded-3xl p-5 border border-zinc-800 text-center">
<div class="text-6xl">🖱️</div>
<h3 class="font-bold mt-3">Gaming Mouse</h3>
<p class="text-yellow-400 font-bold">₹899 <span class="line-through text-zinc-500 text-sm">₹1499</span></p>
<button onclick="addCart()" class="w-full bg-yellow-400 text-black font-bold py-3 rounded-full mt-3">Add to Cart</button>
</div>

<div class="bg-zinc-900 rounded-3xl p-5 border border-zinc-800 text-center">
<div class="text-6xl">⌨️</div>
<h3 class="font-bold mt-3">Keyboard</h3>
<p class="text-yellow-400 font-bold">₹2999 <span class="line-through text-zinc-500 text-sm">₹5999</span></p>
<button onclick="addCart()" class="w-full bg-yellow-400 text-black font-bold py-3 rounded-full mt-3">Add to Cart</button>
</div>
</div>

<script>
let c=0;
function addCart(){
c++;
document.getElementById('cartBtn').innerText='Cart ('+c+') 🛒';
alert('Added to Cart!');
}
</script>
</body>
</html>
